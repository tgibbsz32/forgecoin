name: ForgeCoin desktop frozen mainnet endpoint safety

on:
  push:
    branches:
      - main
      - 'integration/desktop-retired-peer-ports-*'
    paths:
      - 'apps/desktop/**'
      - 'apps/desktop-tauri/**'
      - 'apps/android/app/src/main/java/**'
      - 'apps/explorer/**'
      - 'services/official_pool/jtgrassie/pool.conf'
      - 'services/official_pool/jtgrassie/src/**'
      - 'tests/desktop/**'
      - 'tools/audit_host_ports.py'
      - 'tools/audit_oracle_prelaunch_config.py'
      - 'docs/NETWORK_PORTS.md'
      - 'docs/CURRENT_MAINNET.md'
      - '.github/workflows/desktop-frozen-mainnet-endpoints.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/desktop-tauri/**'
      - 'apps/android/app/src/main/java/**'
      - 'apps/explorer/**'
      - 'services/official_pool/jtgrassie/pool.conf'
      - 'services/official_pool/jtgrassie/src/**'
      - 'tests/desktop/**'
      - 'tools/audit_host_ports.py'
      - 'tools/audit_oracle_prelaunch_config.py'
      - '.github/workflows/desktop-frozen-mainnet-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-frontend:
    name: Endpoint guards and desktop frontend build
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate frozen chain desktop defaults and port separation
        run: python -m unittest discover -s tests/desktop -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json
      - name: Build TypeScript and Vite Tauri UI
        working-directory: apps/desktop-tauri
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  windows-forms-compile:
    name: Compile Windows Forms desktop (no binary publication)
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows Forms with native Framework compiler
        shell: pwsh
        run: |
          $src = Join-Path $PWD 'apps/desktop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (!(Test-Path $compiler)) { throw 'Required .NET Framework C# compiler unavailable' }
          $dest = Join-Path $env:RUNNER_TEMP 'ForgeCoin-Desktop-Endpoint-Check.exe'
          $manifest = Join-Path $src 'app.manifest'
          $program = Join-Path $src 'Program.cs'
          $frgWallet = Join-Path $src 'FrgWalletInput.cs'
          $rpcSession = Join-Path $src 'WalletRpcSession.cs'
          $rpcDigest = Join-Path $src 'WalletRpcDigestTransport.cs'
          $wallet = Join-Path $src 'SolanaWallet.cs'
          $vault = Join-Path $src 'SolanaVault.cs'
          & $compiler /nologo /target:winexe /optimize+ /platform:anycpu `
            "/win32manifest:$manifest" "/out:$dest" `
            /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll `
            $program $frgWallet $rpcSession $rpcDigest $wallet $vault
          if ($LASTEXITCODE -ne 0) { throw 'Windows Forms source compilation failed' }
          if (!(Test-Path $dest)) { throw 'Compiled executable missing' }
          Write-Output 'PASS: Windows Forms source compiled with separated RPC/stat ports'
      - name: Exercise isolated real Windows Forms GUI layout at minimum resolution
        shell: pwsh
        run: |
          $src = Join-Path $PWD 'apps/desktop'
          $test = Join-Path $PWD 'tests/desktop/windows/WinFormsGuiLayoutQa.cs'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'FRG-Private-WinForms-UI-QA.exe'
          & $compiler /nologo /target:exe /optimize+ /platform:anycpu /define:FRG_PRIVATE_UI_QA `
            /main:ForgeCoinDesktop.GuiLayoutQa "/out:$exe" `
            /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll `
            (Join-Path $src 'Program.cs') (Join-Path $src 'FrgWalletInput.cs') `
            (Join-Path $src 'WalletRpcSession.cs') (Join-Path $src 'WalletRpcDigestTransport.cs') `
            (Join-Path $src 'SolanaWallet.cs') (Join-Path $src 'SolanaVault.cs') $test
          if ($LASTEXITCODE -ne 0) { throw 'Private Windows GUI harness compilation failed' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Forms layout or release-lock acceptance failed' }
      - name: Compile isolated real WinForms native wallet Create/Restore acceptance harness
        shell: pwsh
        run: |
          # We do NOT execute this without a verified private prelaunch wallet
          # sidecar. Local QA covers real native Create/Restore/Close behavior.
          $src = Join-Path $PWD 'apps/desktop'
          $test = Join-Path $PWD 'tests/desktop/windows/WinFormsNativeWalletQa.cs'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'FRG-Native-Wallet-GUI-Private-QA.exe'
          & $compiler /nologo /target:exe /optimize+ /platform:anycpu /define:FRG_PRIVATE_UI_QA `
            /main:ForgeCoinDesktop.NativeWalletGuiQa "/out:$exe" `
            /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll `
            (Join-Path $src 'Program.cs') (Join-Path $src 'FrgWalletInput.cs') `
            (Join-Path $src 'WalletRpcSession.cs') (Join-Path $src 'WalletRpcDigestTransport.cs') `
            (Join-Path $src 'SolanaWallet.cs') (Join-Path $src 'SolanaVault.cs') $test
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI wallet acceptance harness compile failed' }
          Write-Output 'PASS: real native Create/Restore GUI harness compiled; on-machine private sidecar acceptance remains separate'
      - name: Run native FRG offline wallet input and mnemonic validation cases
        shell: pwsh
        run: |
          $src = Join-Path $PWD 'apps/desktop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $test = Join-Path $PWD 'tests/desktop/windows/FrgWalletInputTests.cs'
          $exe = Join-Path $env:RUNNER_TEMP 'FRG-Native-Wallet-Input-Tests.exe'
          & $compiler /nologo /target:exe /optimize+ "/out:$exe" `
            /reference:System.dll `
            (Join-Path $src 'FrgWalletInput.cs') $test
          if ($LASTEXITCODE -ne 0) { throw 'Native FRG wallet input test compile failed' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Native FRG wallet input assertions failed' }
      - name: Compile authenticated native wallet Digest QA harness
        shell: pwsh
        run: |
          $src = Join-Path $PWD 'apps/desktop'
          $testDir = Join-Path $PWD 'tests/desktop/windows'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'FRG-Wallet-RPC-Digest-QA.exe'
          & $compiler /nologo /target:exe /optimize+ "/out:$exe" `
            /reference:System.dll `
            (Join-Path $src 'WalletRpcDigestTransport.cs') `
            (Join-Path $testDir 'WalletRpcDigestProbe.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Digest harness compile failed' }
          Write-Output 'PASS: authenticated native wallet Digest QA test harness compiles'
          $acceptance = Join-Path $env:RUNNER_TEMP 'FRG-Wallet-Native-Authenticated-Acceptance.exe'
          & $compiler /nologo /target:exe /optimize+ "/out:$acceptance" `
            /reference:System.dll /reference:System.Web.Extensions.dll `
            (Join-Path $src 'WalletRpcSession.cs') `
            (Join-Path $src 'WalletRpcDigestTransport.cs') `
            (Join-Path $src 'FrgWalletInput.cs') `
            (Join-Path $testDir 'WalletRpcSessionAcceptance.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Native wallet authenticated lifecycle test compile failed' }
          Write-Output 'PASS: authenticated create/restore/restart acceptance harness compiles (native execution separately verified on pinned Windows machine)'
      - name: Exercise fail-closed private packaging and source-only QA path
        shell: pwsh
        run: |
          $src = Join-Path $PWD 'apps/desktop'
          $out = Join-Path $env:RUNNER_TEMP 'FRG-SourceOnly-NoSidecars'
          & (Join-Path $src 'build.ps1') -SourceOnly -OutputRoot $out
          if (!(Test-Path (Join-Path $out 'ForgeCoin Desktop.exe'))) {
            throw 'Source-only compilation did not create the QA executable'
          }
          if (Test-Path (Join-Path $out 'bin')) {
            throw 'Source-only QA must not include daemon or wallet sidecars'
          }
          $unexpected = Join-Path $env:RUNNER_TEMP 'FRG-Unapproved-Package'
          try {
            & (Join-Path $src 'build.ps1') -ForgeBin $src -OutputRoot $unexpected
            throw 'Public packaging unexpectedly succeeded'
          } catch {
            if ($_.Exception.Message -notmatch 'Public packaging NOT authorized') {
              throw
            }
          }
          if (Test-Path $unexpected) {
            throw 'Denied public packaging created an artifact'
          }
          $fake = Join-Path $env:RUNNER_TEMP 'FRG-Tampered-Native-Sidecars'
          New-Item -ItemType Directory -Path $fake -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $fake 'forged.exe') -Value 'not native'
          Set-Content -LiteralPath (Join-Path $fake 'forge-wallet-rpc.exe') -Value 'not native'
          $rejected = Join-Path $env:RUNNER_TEMP 'FRG-Tampered-Package'
          try {
            & (Join-Path $src 'build.ps1') -PrivatePrelaunch -ForgeBin $fake -OutputRoot $rejected
            throw 'Tampered sidecar packaging unexpectedly succeeded'
          } catch {
            if ($_.Exception.Message -notmatch 'sidecar hash mismatch') {
              throw
            }
          }
          if (Test-Path $rejected) {
            throw 'Mismatched sidecars created a package'
          }
          Write-Output 'PASS: source-only build, public-release denial and tampered sidecar rejection'
