name: mFRG Step 32 phase transition evidence gate
on:
  pull_request:
    paths:
      - 'tools/mfrg_phase32_readiness.py'
      - 'tools/test_mfrg_phase32_readiness.py'
      - '.github/workflows/mfrg-phase32-evidence-gate.yml'
      - 'docs/handoffs/MFRG_500M_STEP_32_PHASE_TRANSITION_2026-10-28.md'
  push:
    branches: [main]
    paths:
      - 'tools/mfrg_phase32_readiness.py'
      - 'tools/test_mfrg_phase32_readiness.py'
      - '.github/workflows/mfrg-phase32-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_mfrg_phase32_readiness.py
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 tools/test_mfrg_approved_checkpoint_gate.py
      - run: python3 tools/test_mfrg_signed_review_quorum.py
