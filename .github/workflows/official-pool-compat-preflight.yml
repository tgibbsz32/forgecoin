name: ForgeCoin official C pool compatibility preflight
on:
  push:
    branches: [main]
    paths:
      - 'services/official_pool/**'
      - 'src/cryptonote_config.h'
      - '.github/workflows/official-pool-compat-preflight.yml'
  pull_request:
    paths:
      - 'services/official_pool/**'
      - 'src/cryptonote_config.h'
      - '.github/workflows/official-pool-compat-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-guards:
    name: Offline FRG source preflight (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            services/official_pool/
            src/cryptonote_config.h
            .github/workflows/pool-native-static-link-ci.yml
            .github/workflows/pool-native-arm64-link-ci.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify research boundaries and FRG configuration constants
        run: python -m unittest discover -s services/official_pool/tests -p 'test_*.py' -v
  native-c-money-test:
    name: Exact FRG units and integer operator fee (Linux C)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/official_pool
      - name: Build only the standalone monetary code (no pool or wallet link)
        run: gcc -std=c11 -pedantic -Wall -Wextra -Werror -O2 -o /tmp/frg-money-test services/official_pool/tests/test_currency.c
      - name: Assert parser, overflow and integer pool fee
        run: /tmp/frg-money-test
      - name: Install JSON-C headers for fail-closed block-acknowledgment fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libjson-c-dev
      - name: Compile and test native daemon submission response validation
        run: |
          gcc -std=c11 -pedantic -Wall -Wextra -Werror -O2 \
            -o /tmp/frg-submit-receipt-test services/official_pool/tests/test_block_submit_receipt.c -ljson-c
          /tmp/frg-submit-receipt-test
