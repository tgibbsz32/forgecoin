name: Native pool offline regressions
on:
  pull_request:
    paths:
      - 'services/pool_research/**'
      - 'services/__init__.py'
      - '.github/workflows/pool-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pool-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline fixtures only; no mining, chain or payout calls
        run: python -W error::ResourceWarning -m unittest discover -s services/pool_research -t . -v
