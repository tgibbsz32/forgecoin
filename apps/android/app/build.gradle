plugins { id 'com.android.application' }
android {
    namespace 'org.forgecoin.p2ptest'
    compileSdk 35
    defaultConfig {
        applicationId 'org.forgecoin.p2ptest'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-phase3'
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libforged.so'] } }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
}
